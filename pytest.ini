[pytest]
# Databricks workspace FUSE mount doesn't support __pycache__ or .pytest_cache
# directories. conftest.py sets sys.dont_write_bytecode = True to prevent the
# assertion rewriter from creating __pycache__; -p no:cacheprovider disables
# the .pytest_cache directory.
addopts = -p no:cacheprovider --tb=short -v
testpaths = tests