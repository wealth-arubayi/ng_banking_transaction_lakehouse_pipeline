resources:
  jobs:
    ng_banking_transaction_archive:
      name: ng_banking_transaction_archive
      description: >
        Weekly housekeeping job: sweeps transaction_files/processed/ into
        transaction_files/archive/YYYY/MM/week_NN/, grouped by year, month, and
        week-of-month. Runs independently of the daily ingest -> mart pipeline
        since archiving is not on the critical path for curated data or the marts.

      schedule:
        quartz_cron_expression: "0 0 3 ? * SUN" # every Sunday at 03:00
        timezone_id: Africa/Lagos
        pause_status: UNPAUSED

      email_notifications:
        on_failure:
          - ${var.notification_email}
        on_success:
          - ${var.notification_email}

      tasks:
        - task_key: 06_archive_processed_files
          notebook_task:
            notebook_path: ../notebooks/06_archive_processed_files.py
            base_parameters:
              catalog: ${var.catalog}
          max_retries: 1
          min_retry_interval_millis: 60000
